$kind: http-request
description: ""
url: http://localhost:8080/auth/login
method: POST
body:
  type: json
  content: |-
    {
      "email": "usuario.teste@estoque.local",
      "senha": "Teste@2026!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const resposta = pm.response.json();
          pm.collectionVariables.set("token_user", resposta.token);
      }
    language: text/javascript
order: 2000
