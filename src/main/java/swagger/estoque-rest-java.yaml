components:
  schemas:
    LoginDTO:
      required:
      - email
      - senha
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@exemplo.com
        senha:
          type: string
          example: senhaExemplo123
      additionalProperties: false
    TokenDTO:
      required:
      - tipo
      - token
      type: object
      properties:
        token:
          type: string
          description: Token JWT assinado.
        tipo:
          type: string
          example: Bearer
          enum:
          - Bearer
    EstoqueDTO:
      required:
      - localizacao
      - nome
      type: object
      properties:
        nome:
          maxLength: 100
          minLength: 1
          type: string
          example: Estoque Principal
        localizacao:
          maxLength: 150
          minLength: 1
          type: string
          example: Blumenau
    Estoque:
      required:
      - id
      - localizacao
      - nome
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 2
        nome:
          type: string
          example: Estoque Principal
        localizacao:
          type: string
          example: Blumenau
      description: Dados de um estoque. A lista de produtos não aparece na resposta.
    ProdutoDTO:
      required:
      - estoqueId
      - nome
      - preco
      - quantidade
      - quantidadeMinima
      type: object
      properties:
        nome:
          maxLength: 100
          minLength: 1
          type: string
          example: Mouse Gamer
        descricao:
          maxLength: 500
          type: string
          nullable: true
          example: Mouse sem fio
        preco:
          minimum: 0
          exclusiveMinimum: true
          type: number
          format: double
          example: 150.0
        quantidade:
          minimum: 0
          type: integer
          format: int32
          example: 20
        quantidadeMinima:
          minimum: 0
          type: integer
          format: int32
          example: 5
        estoqueId:
          minimum: 1
          type: integer
          format: int32
          example: 2
    Produto:
      required:
      - estoque
      - id
      - nome
      - preco
      - quantidade
      - quantidadeMinima
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 3
        nome:
          type: string
          example: Mouse Gamer
        descricao:
          type: string
          nullable: true
          example: Mouse sem fio
        preco:
          type: number
          format: double
          example: 150.0
        quantidade:
          type: integer
          format: int32
          example: 20
        quantidadeMinima:
          type: integer
          format: int32
          example: 5
        estoque:
          $ref: '#/components/schemas/Estoque'
    UsuarioCadastroDTO:
      required:
      - email
      - senha
      type: object
      properties:
        email:
          type: string
          format: email
          example: funcionario@exemplo.com
        senha:
          minLength: 8
          type: string
          example: senhaExemplo123
        role:
          type: string
          description: 'Opcional: quando não informado, o perfil será USER.'
          enum:
          - USER
          - ADMIN
          default: USER
    UsuarioAtualizacaoDTO:
      required:
      - email
      type: object
      properties:
        email:
          type: string
          format: email
          example: funcionario.novo@exemplo.com
        senha:
          minLength: 8
          type: string
          description: 'Opcional: se não enviar a senha, a atual será mantida.'
    UsuarioDTO:
      required:
      - email
      - id
      - role
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 2
        email:
          type: string
          format: email
          example: funcionario@exemplo.com
        role:
          type: string
          example: USER
          enum:
          - USER
          - ADMIN
      description: Dados públicos do usuário. A senha e o hash da senha não são devolvidos.
    ErroAPI:
      required:
      - data
      - erro
      - mensagem
      - status
      type: object
      properties:
        status:
          type: integer
          example: 400
        erro:
          type: string
          example: Bad Request
        mensagem:
          type: string
          example: O nome do estoque é obrigatório.
        data:
          type: string
          example: 2026-11-18 19:00:00
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Faça POST /auth/login para receber o token. Nas rotas protegidas, envie Authorization:
        Bearer SEU_TOKEN.'
      scheme: bearer
      bearerFormat: JWT
